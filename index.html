<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>REF HOCKEY</title>

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#eeeeee;
    color:#111;
    font-family:'Unbounded',sans-serif;
}

header{
    background:#111;
    color:#fff;
    padding:25px 30px;
    font-size:23px;
    font-weight:700;
}

.container{
    max-width:1100px;
    margin:35px auto;
    padding:0 20px;
}

h1{
    font-size:28px;
    margin:0 0 25px;
}

.matches{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.match{
    background:#fff;
    border-left:5px solid #ff6a00;
    padding:25px;
    cursor:pointer;
    transition:.2s;
}

.match:hover{
    background:#111;
    color:#fff;
    transform:translateY(-2px);
}

.date{
    font-size:11px;
    color:#777;
    margin-bottom:18px;
}

.match:hover .date{
    color:#aaa;
}

.teams{
    font-size:18px;
    font-weight:700;
    line-height:1.5;
}

.info{
    margin-top:18px;
    font-size:11px;
    color:#777;
}

.match:hover .info{
    color:#aaa;
}

.empty{
    background:#fff;
    padding:30px;
    border-left:5px solid #ff6a00;
}

.error{
    background:#fff;
    padding:20px;
    color:#b00000;
    border-left:5px solid #b00000;
}

@media(max-width:700px){
    .matches{
        grid-template-columns:1fr;
    }

    h1{
        font-size:22px;
    }

    .teams{
        font-size:16px;
    }
}
</style>
</head>

<body>

<header>
    REF HOCKEY
</header>

<div class="container">

    <h1>МАТЧИ</h1>

    <div id="matches" class="matches">
        <div class="empty">Загрузка матчей...</div>
    </div>

</div>

<script>

const SUPABASE_URL =
    "https://ckfwxtirevtzgrzwypio.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_N55S09HuLN-2XlnYCjE61w_AKX12EuB";

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


function escapeHtml(text){
    return String(text || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function formatDate(date){

    if(!date) return "";

    const months = [
        "января","февраля","марта","апреля",
        "мая","июня","июля","августа",
        "сентября","октября","ноября","декабря"
    ];

    const d = new Date(date + "T00:00:00");

    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}


async function loadMatches(){

    const box =
        document.getElementById("matches");

    const { data, error } =
        await supabase
            .from("matches")
            .select("*")
            .order("match_date",{ascending:true})
            .order("match_time",{ascending:true});

    if(error){

        console.error(error);

        box.innerHTML = `
            <div class="error">
                Не удалось загрузить матчи.
            </div>
        `;

        return;
    }


    if(!data || !data.length){

        box.innerHTML = `
            <div class="empty">
                Матчей пока нет.
            </div>
        `;

        return;
    }


    box.innerHTML = data.map(match => `

        <div class="match"
             onclick="openMatch(${match.id})">

            <div class="date">
                ${formatDate(match.match_date)}
            </div>

            <div class="teams">
                ${escapeHtml(match.team1)}
                —
                ${escapeHtml(match.team2)}
            </div>

            <div class="info">

                ${match.match_time
                    ? escapeHtml(match.match_time)
                    : ""}

                ${match.place
                    ? " • " + escapeHtml(match.place)
                    : ""}

            </div>

        </div>

    `).join("");
}


function openMatch(id){

    window.location.href =
        "match.html?id=" + encodeURIComponent(id);

}


loadMatches();

</script>

</body>
</html>
