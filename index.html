<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>REF HOCKEY</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="top">

  <div class="top-inner">

    <a class="logo" href="index.html">
      REF HOCKEY
    </a>

    <nav class="nav">

      <a
        id="matchesTab"
        class="active"
        href="index.html"
      >
        Матчи
      </a>

      <a href="index.html?archive=1">
        Архив
      </a>

    </nav>

  </div>

</header>


<main class="wrap">

  <section class="hero">

    <div>

      <h1 id="pageTitle">
        БЛИЖАЙШИЕ МАТЧИ
      </h1>

      <p>
        Судейские бригады хоккейных матчей.
      </p>

    </div>

  </section>


  <div
    id="status"
    class="status"
  >
    Загрузка...
  </div>


  <section
    id="matches"
    class="matches"
  ></section>

</main>


<script src="config.js"></script>

<script>

let archiveMode =
  new URLSearchParams(location.search).get("archive") === "1";


function renderNavigation(){

  const matchesTab =
    document.getElementById("matchesTab");

  if(archiveMode){

    matchesTab.classList.remove("active");

  }else{

    matchesTab.classList.add("active");

  }

}


async function loadMatches(){

  const status =
    document.getElementById("status");

  const box =
    document.getElementById("matches");

  const title =
    document.getElementById("pageTitle");


  title.textContent =
    archiveMode
      ? "АРХИВ МАТЧЕЙ"
      : "БЛИЖАЙШИЕ МАТЧИ";


  try{

    const matches =
      await api(
        "matches?select=*&order=match_date.asc,match_time.asc"
      );


    const filtered =
      matches.filter(match =>
        archiveMode
          ? isArchived(match)
          : !isArchived(match)
      );


    status.textContent = "";


    if(!filtered.length){

      box.innerHTML = `
        <div class="empty">
          ${
            archiveMode
              ? "В архиве пока нет матчей."
              : "Ближайших матчей пока нет."
          }
        </div>
      `;

      return;
    }


    box.innerHTML =
      filtered.map(match => `

        <article
          class="match-card"
          onclick="location.href='match.html?id=${match.id}'"
        >

          <div class="match-date">

            ${esc(
              formatDateWithWeekday(match.match_date)
            )}

          </div>


          <div class="teams">

            ${esc(match.team1)}
            —
            ${esc(match.team2)}

          </div>


          <div class="match-meta">

            ${
              match.match_time
                ? esc(match.match_time)
                : ""
            }

            ${
              match.place
                ? `<br>${esc(match.place)}`
                : ""
            }

          </div>

        </article>

      `).join("");

  }catch(error){

    status.className =
      "status error";

    status.textContent =
      "Ошибка загрузки: " +
      error.message;

  }

}


renderNavigation();
loadMatches();


// Автоматически проверяем время
// каждые 30 секунд.
// Поэтому матч попадёт в архив практически
// сразу после наступления времени.

setInterval(loadMatches,30000);

</script>

</body>

</html>
