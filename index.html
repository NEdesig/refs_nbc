<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Матчи</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Unbounded", sans-serif;
            background: #f5f5f5;
            color: #202024;
        }

        /* HEADER */

        header {
            background: #202024;
            color: white;
            padding: 22px 25px;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .admin-link {
            color: white;
            text-decoration: none;
            font-size: 11px;
            opacity: .6;
        }

        /* MAIN */

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 55px 25px 80px;
        }

        .page-title {
            font-size: 48px;
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 40px;
        }

        /* MATCHES */

        .matches {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .match {
            position: relative;

            background: white;
            border-radius: 28px;

            padding: 30px 32px;

            cursor: pointer;

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .match:hover {
            transform: translateY(-4px);

            box-shadow:
                0 15px 40px rgba(0,0,0,.08);
        }

        .match-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 20px;

            margin-bottom: 32px;
        }

        .match-date {
            font-size: 12px;
            color: #777;
            font-weight: 500;
        }

        .arrow {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            background: #f1f1f1;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;

            transition: .2s;
        }

        .match:hover .arrow {
            background: #ff5b22;
            color: white;
        }

        .teams {
            font-size: 28px;
            line-height: 1.35;
            font-weight: 700;

            letter-spacing: -1px;
        }

        .match-bottom {
            display: flex;
            gap: 25px;

            color: #777;

            font-size: 12px;
        }

        .match-bottom span {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .time {
            color: #202024;
            font-weight: 700;
        }

        /* EMPTY */

        .empty {
            background: white;

            border-radius: 28px;

            padding: 60px 30px;

            text-align: center;

            color: #888;

            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            header {
                padding: 20px;
            }

            .logo {
                font-size: 16px;
            }

            .container {
                padding: 38px 16px 60px;
            }

            .page-title {
                font-size: 34px;
                margin-bottom: 25px;
            }

            .match {
                border-radius: 23px;
                padding: 23px;
            }

            .match-top {
                margin-bottom: 25px;
            }

            .teams {
                font-size: 20px;
                line-height: 1.5;
            }

            .match-bottom {
                flex-direction: column;
                gap: 10px;
            }

            .arrow {
                width: 36px;
                height: 36px;
                flex-shrink: 0;
            }
        }

    </style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            REF HOCKEY
        </div>

        <a href="admin.html" class="admin-link">
            ADMIN
        </a>

    </div>

</header>


<main class="container">

    <h1 class="page-title">
        МАТЧИ
    </h1>

    <div id="matches" class="matches"></div>

</main>


<script>

    function getMatches() {

        return JSON.parse(
            localStorage.getItem("matches")
        ) || [];

    }


    function getMonth(month) {

        const months = {
            "01": "января",
            "02": "февраля",
            "03": "марта",
            "04": "апреля",
            "05": "мая",
            "06": "июня",
            "07": "июля",
            "08": "августа",
            "09": "сентября",
            "10": "октября",
            "11": "ноября",
            "12": "декабря"
        };

        return months[month] || month;

    }


    function formatDate(date) {

        const parts = date.split("-");

        if (parts.length !== 3) {
            return date;
        }

        return `${parts[2]} ${getMonth(parts[1])} ${parts[0]}`;

    }


    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text || "";

        return div.innerHTML;

    }


    function showMatches() {

        const container =
            document.getElementById("matches");

        const matches =
            getMatches();


        container.innerHTML = "";


        if (matches.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    Пока нет запланированных матчей
                </div>
            `;

            return;

        }


        matches.forEach(match => {

            const card =
                document.createElement("div");

            card.className = "match";


            card.innerHTML = `

                <div class="match-top">

                    <div class="match-date">
                        ${formatDate(match.date)}
                    </div>

                    <div class="arrow">
                        →
                    </div>

                </div>


                <div class="teams">

                    ${escapeHtml(match.team1)}

                    —

                    ${escapeHtml(match.team2)}

                </div>


                <div class="match-bottom">

                    <span class="time">
                        ${escapeHtml(match.time)}
                    </span>

                    <span>
                        ●
                        ${escapeHtml(match.place)}
                    </span>

                </div>

            `;


            card.onclick = () => {

                localStorage.setItem(
                    "selectedMatch",
                    match.id
                );

                window.location.href =
                    "match.html";

            };


            container.appendChild(card);

        });

    }


    showMatches();

</script>

</body>
</html>
