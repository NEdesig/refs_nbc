<!doctype html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>REF HOCKEY</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top">

  <div class="top-inner">

    <a class="logo" href="index.html">
      REF HOCKEY
    </a>

    <nav class="nav">

      <a class="active" href="index.html">
        Матчи
      </a>

      <a href="admin.html">
        Админка
      </a>

    </nav>

  </div>

</header>


<main class="wrap">

  <section class="hero">

    <div>

      <h1>
        СУДЕЙСКИЕ БРИГАДЫ
      </h1>

      <p>
        Матчи и составы судейских бригад.
      </p>

    </div>

  </section>


  <h2 class="section-title">
    БЛИЖАЙШИЕ МАТЧИ
  </h2>


  <div id="status" class="status">
    Загрузка...
  </div>


  <section id="matches" class="matches"></section>

</main>


<script src="config.js"></script>

<script>

async function loadMatches(){

  const status =
    document.getElementById("status");

  const box =
    document.getElementById("matches");

  try{

    const matches =
      await api(
        "matches?select=*&order=match_date.asc,match_time.asc"
      );

    status.textContent = "";

    if(!matches.length){

      box.innerHTML =
        '<div class="empty">Матчей пока нет.</div>';

      return;
    }

    box.innerHTML =
      matches.map(m => `

        <article
          class="match-card"
          onclick="location.href='match.html?id=${m.id}'"
        >

          <div class="match-date">
            ${formatDate(m.match_date)}
          </div>

          <div class="teams">
            ${esc(m.team1)} — ${esc(m.team2)}
          </div>

          <div class="match-meta">

            ${esc(m.match_time || "")}

            <br>

            ${esc(m.place || "")}

          </div>

        </article>

      `).join("");

  }catch(e){

    status.className =
      "status error";

    status.textContent =
      "Ошибка загрузки: " + e.message;

  }

}

loadMatches();

</script>

</body>
</html>
