<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Матчи</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Unbounded", sans-serif;
    background: #f3f3f3;
    color: #1d1d1f;
}

/* HEADER */

header {
    background: #171719;
    color: white;
    padding: 25px;
}

.header-inner {
    max-width: 1150px;
    margin: auto;
}

.logo {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -1px;
}

/* MAIN */

.container {
    max-width: 1150px;
    margin: auto;
    padding: 55px 25px 80px;
}

.page-title {
    font-size: 48px;
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: -2px;
    margin-bottom: 35px;
}

/* MATCHES */

.matches {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.match {
    background: #fff;
    border-radius: 25px;
    padding: 30px;

    cursor: pointer;

    border: 1px solid #e5e5e5;

    transition: .2s ease;
}

.match:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(0,0,0,.09);
}

.match-top {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 28px;
}

.match-date {
    font-size: 12px;
    font-weight: 500;
    color: #777;
}

.arrow {
    width: 44px;
    height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #eeeeef;

    font-size: 20px;

    transition: .2s;
}

.match:hover .arrow {
    background: #ff5a1f;
    color: white;
}

.teams {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.4;

    letter-spacing: -1px;

    margin-bottom: 28px;
}

.match-bottom {
    display: flex;
    gap: 25px;

    font-size: 12px;
    color: #777;
}

.time {
    color: #171719;
    font-weight: 700;
}

.empty {
    background: white;
    border-radius: 25px;

    padding: 60px 25px;

    text-align: center;

    color: #888;

    font-size: 13px;
}

/* MOBILE */

@media(max-width:700px) {

    header {
        padding: 21px;
    }

    .logo {
        font-size: 16px;
    }

    .container {
        padding: 38px 16px 60px;
    }

    .page-title {
        font-size: 34px;
        margin-bottom: 25px;
    }

    .match {
        padding: 23px;
        border-radius: 22px;
    }

    .teams {
        font-size: 20px;
        line-height: 1.5;
    }

    .match-bottom {
        flex-direction: column;
        gap: 10px;
    }

    .arrow {
        width: 38px;
        height: 38px;
    }
}

</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            REF HOCKEY
        </div>

    </div>

</header>


<main class="container">

    <h1 class="page-title">
        МАТЧИ
    </h1>

    <div
        id="matches"
        class="matches">
    </div>

</main>


<script>

function getMatches() {

    return JSON.parse(
        localStorage.getItem("matches")
    ) || [];

}


function getMonth(month) {

    const months = {
        "01":"января",
        "02":"февраля",
        "03":"марта",
        "04":"апреля",
        "05":"мая",
        "06":"июня",
        "07":"июля",
        "08":"августа",
        "09":"сентября",
        "10":"октября",
        "11":"ноября",
        "12":"декабря"
    };

    return months[month] || month;

}


function formatDate(date) {

    const parts = date.split("-");

    if (parts.length !== 3) {
        return date;
    }

    return `${parts[2]} ${getMonth(parts[1])} ${parts[0]}`;

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}


function showMatches() {

    const container =
        document.getElementById("matches");

    const matches =
        getMatches();


    container.innerHTML = "";


    if (matches.length === 0) {

        container.innerHTML = `
            <div class="empty">
                ПОКА НЕТ МАТЧЕЙ
            </div>
        `;

        return;

    }


    matches.forEach(match => {

        const card =
            document.createElement("div");

        card.className = "match";


        card.innerHTML = `

            <div class="match-top">

                <div class="match-date">
                    ${formatDate(match.date)}
                </div>

                <div class="arrow">
                    →
                </div>

            </div>


            <div class="teams">

                ${escapeHtml(match.team1)}
                —
                ${escapeHtml(match.team2)}

            </div>


            <div class="match-bottom">

                <span class="time">
                    ${escapeHtml(match.time)}
                </span>

                <span>
                    ${escapeHtml(match.place)}
                </span>

            </div>

        `;


        card.onclick = () => {

            localStorage.setItem(
                "selectedMatch",
                match.id
            );

            window.location.href =
                "match.html";

        };


        container.appendChild(card);

    });

}


showMatches();

</script>

</body>
</html>
