<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Матч — REF HOCKEY</title>

<link rel="stylesheet" href="style.css?v=4">

</head>

<body>

<header class="top">

  <div class="top-inner">

    <a class="logo" href="index.html">
      REF HOCKEY
    </a>

    <nav class="nav">

      <a href="index.html">
        Матчи
      </a>

      <a href="index.html?archive=1">
        Архив
      </a>

    </nav>

  </div>

</header>


<main class="wrap">

  <a
    class="back"
    href="index.html"
  >
    ← ВСЕ МАТЧИ
  </a>


  <div id="content"></div>

</main>


<script src="config.js"></script>

<script>

const roles = [

  ["Главный судья","ref1"],

  ["Главный судья","ref2"],

  ["Линейный судья","line1"],

  ["Линейный судья","line2"],

  ["Секретарь матча","secretary"],

  ["Информатор","announcer"],

  ["Судья при оштрафованных","penalty1"],

  ["Судья при оштрафованных","penalty2"],

  ["Судья за воротами","goal1"],

  ["Судья за воротами","goal2"]

];


async function load(){

  const id =
    new URLSearchParams(location.search)
      .get("id");


  const box =
    document.getElementById("content");


  if(!id){

    box.innerHTML =
      '<div class="empty">Матч не найден.</div>';

    return;

  }


  try{

    const matches =
      await api(
        `matches?id=eq.${encodeURIComponent(id)}&select=*`
      );


    if(!matches.length){

      box.innerHTML =
        '<div class="empty">Матч не найден.</div>';

      return;

    }


    const match =
      matches[0];


    const ids =
      roles
        .map(role => match[role[1]])
        .filter(Boolean);


    let referees = [];


    if(ids.length){

      referees =
        await api(
          `referees?id=in.(${ids.join(",")})&select=id,name`
        );

    }


    const names = {};


    referees.forEach(referee => {

      names[referee.id] =
        referee.name;

    });


    const rows =
      roles

        .filter(role =>
          match[role[1]] &&
          names[match[role[1]]]
        )

        .map(role => `

          <div class="ref-row">

            <div class="role">
              ${esc(role[0])}
            </div>

            <div class="person">
              ${esc(names[match[role[1]]])}
            </div>

          </div>

        `)

        .join("");


    const archived =
      isArchived(match);


    box.innerHTML = `

      <section class="match-head">

        <div class="date">

          ${esc(
            formatDateWithWeekday(
              match.match_date
            )
          )}

        </div>


        <h1>

          ${esc(match.team1)}
          —
          ${esc(match.team2)}

        </h1>


        <div class="meta">

          ${
            match.match_time
              ? esc(match.match_time)
              : ""
          }

          ${
            match.place
              ? `<br>${esc(match.place)}`
              : ""
          }

        </div>

      </section>


      <section class="brigade">

        <h2>
          СУДЕЙСКАЯ БРИГАДА
        </h2>

        ${
          rows ||
          '<div class="empty">Состав бригады пока не указан.</div>'
        }

      </section>

    `;

  }catch(error){

    box.innerHTML =
      `<div class="empty">
        Ошибка: ${esc(error.message)}
      </div>`;

  }

}


load();

</script>

</body>

</html>
