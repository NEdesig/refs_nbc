<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Матч</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Unbounded", sans-serif;
    background: #f3f3f3;
    color: #1d1d1f;
}

/* HEADER */

header {
    background: #171719;
    color: white;
    padding: 21px 25px;
}

.header-inner {
    max-width: 1150px;
    margin: auto;

    display: flex;
    align-items: center;
}

.back {
    color: white;
    text-decoration: none;

    font-size: 11px;
    font-weight: 500;

    opacity: .7;

    transition: .2s;
}

.back:hover {
    opacity: 1;
}

/* MAIN */

.container {
    max-width: 900px;
    margin: auto;

    padding: 40px 20px 70px;
}

/* MATCH */

.match-card {
    background: #171719;
    color: white;

    border-radius: 28px;

    padding: 38px;

    margin-bottom: 18px;
}

.match-label {
    color: #ff5a1f;

    font-size: 11px;
    font-weight: 700;

    margin-bottom: 20px;
}

.teams {
    font-size: 34px;
    line-height: 1.4;

    font-weight: 800;

    letter-spacing: -1.5px;

    margin-bottom: 35px;
}

.match-info {
    display: flex;
    flex-wrap: wrap;

    gap: 25px;

    color: #c4c4c4;

    font-size: 12px;
}

.match-info strong {
    color: white;
}

/* BRIGADE */

.brigade {
    background: white;

    border-radius: 28px;

    padding: 30px;

    border: 1px solid #e3e3e3;
}

.brigade-title {
    font-size: 22px;
    font-weight: 800;

    letter-spacing: -1px;

    margin-bottom: 10px;
}

.brigade-subtitle {
    color: #888;

    font-size: 10px;

    margin-bottom: 20px;
}

/* PERSON */

.person {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 20px;

    padding: 20px 0;

    border-bottom: 1px solid #e8e8e8;
}

.person:last-child {
    border-bottom: none;
}

.role {
    font-size: 10px;

    color: #888;

    font-weight: 500;

    margin-bottom: 6px;
}

.name {
    font-size: 14px;

    font-weight: 700;
}

.person::after {
    content: "→";

    width: 35px;
    height: 35px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f0f0f0;

    font-size: 15px;

    flex-shrink: 0;
}

/* EMPTY */

.empty {
    text-align: center;

    padding: 25px;

    color: #888;

    font-size: 11px;
}

/* MOBILE */

@media(max-width:700px) {

    header {
        padding: 20px;
    }

    .container {
        padding: 25px 16px 55px;
    }

    .match-card {
        padding: 27px 23px;
        border-radius: 23px;
    }

    .teams {
        font-size: 24px;
    }

    .match-info {
        flex-direction: column;
        gap: 11px;
    }

    .brigade {
        padding: 23px;
        border-radius: 23px;
    }

    .brigade-title {
        font-size: 19px;
    }

    .person {
        padding: 18px 0;
    }

    .name {
        font-size: 13px;
    }

}

</style>
</head>

<body>

<header>

    <div class="header-inner">

        <a
            href="index.html"
            class="back">

            ← ВСЕ МАТЧИ

        </a>

    </div>

</header>


<main class="container">

    <div id="content"></div>

</main>


<script>

function getMatches() {

    return JSON.parse(
        localStorage.getItem("matches")
    ) || [];

}


function getMonth(month) {

    const months = {
        "01":"января",
        "02":"февраля",
        "03":"марта",
        "04":"апреля",
        "05":"мая",
        "06":"июня",
        "07":"июля",
        "08":"августа",
        "09":"сентября",
        "10":"октября",
        "11":"ноября",
        "12":"декабря"
    };

    return months[month] || month;

}


function formatDate(date) {

    const parts = date.split("-");

    if (parts.length !== 3) {
        return date;
    }

    return `${parts[2]} ${getMonth(parts[1])} ${parts[0]}`;

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}


function addPerson(
    container,
    role,
    name
) {

    if (!name || !name.trim()) {
        return;
    }


    const person =
        document.createElement("div");

    person.className =
        "person";


    person.innerHTML = `

        <div>

            <div class="role">
                ${escapeHtml(role)}
            </div>

            <div class="name">
                ${escapeHtml(name)}
            </div>

        </div>

    `;


    container.appendChild(person);

}


function showMatch() {

    const content =
        document.getElementById("content");


    const selectedId =
        Number(
            localStorage.getItem(
                "selectedMatch"
            )
        );


    const match =
        getMatches().find(
            item => item.id === selectedId
        );


    if (!match) {

        content.innerHTML = `

            <div class="brigade">

                <div class="empty">
                    МАТЧ НЕ НАЙДЕН
                </div>

            </div>

        `;

        return;

    }


    content.innerHTML = `

        <section class="match-card">

            <div class="match-label">
                МАТЧ
            </div>

            <div class="teams">

                ${escapeHtml(match.team1)}
                —
                ${escapeHtml(match.team2)}

            </div>


            <div class="match-info">

                <span>
                    <strong>
                        ${formatDate(match.date)}
                    </strong>
                </span>

                <span>
                    <strong>
                        ${escapeHtml(match.time)}
                    </strong>
                </span>

                <span>
                    ${escapeHtml(match.place)}
                </span>

            </div>

        </section>


        <section class="brigade">

            <div class="brigade-title">
                СУДЕЙСКАЯ БРИГАДА
            </div>

            <div class="brigade-subtitle">
                НАЗНАЧЕННЫЕ ОФИЦИАЛЬНЫЕ ЛИЦА МАТЧА
            </div>

            <div id="people"></div>

        </section>

    `;


    const people =
        document.getElementById("people");


    addPerson(
        people,
        "ГЛАВНЫЙ СУДЬЯ",
        match.mainReferee1
    );


    addPerson(
        people,
        "ГЛАВНЫЙ СУДЬЯ",
        match.mainReferee2
    );


    addPerson(
        people,
        "ЛИНЕЙНЫЙ СУДЬЯ",
        match.lineReferee1
    );


    addPerson(
        people,
        "ЛИНЕЙНЫЙ СУДЬЯ",
        match.lineReferee2
    );


    addPerson(
        people,
        "СЕКРЕТАРЬ МАТЧА",
        match.secretary
    );


    addPerson(
        people,
        "ИНФОРМАТОР",
        match.announcer
    );


    addPerson(
        people,
        "СУДЬИ ПРИ ОШТРАФОВАННЫХ",
        match.penaltyJudges
    );


    addPerson(
        people,
        "СУДЬИ ЗА ВОРОТАМИ",
        match.goalJudges
    );


    if (!people.innerHTML.trim()) {

        people.innerHTML = `

            <div class="empty">
                СУДЕЙСКАЯ БРИГАДА ПОКА НЕ НАЗНАЧЕНА
            </div>

        `;

    }

}


showMatch();

</script>

</body>
</html>
