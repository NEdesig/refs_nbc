<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Матч — REF HOCKEY</title>

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eeeeee;
    color:#111;
    font-family:'Unbounded',sans-serif;
}

header{
    background:#111;
    color:#fff;
    padding:22px 30px;
    font-size:22px;
    font-weight:700;
}

.back{
    display:inline-block;
    color:#fff;
    text-decoration:none;
    margin-top:10px;
    font-size:11px;
    opacity:.7;
}

.container{
    max-width:1000px;
    margin:35px auto;
    padding:0 20px;
}

.match-card{
    background:#111;
    color:#fff;
    padding:40px 25px;
    text-align:center;
    border-bottom:6px solid #ff6a00;
}

.date{
    color:#aaa;
    font-size:11px;
    margin-bottom:20px;
}

.teams{
    font-size:28px;
    font-weight:700;
}

.info{
    color:#aaa;
    font-size:11px;
    margin-top:20px;
}

.ref-card{
    margin-top:25px;
    background:#fff;
    padding:30px;
}

.ref-card h2{
    margin:0 0 20px;
    font-size:19px;
}

.role{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:17px 0;
    border-bottom:1px solid #ddd;
}

.role-name{
    color:#777;
    font-size:10px;
}

.role-person{
    font-size:12px;
    font-weight:600;
    text-align:right;
}

.error{
    background:#fff;
    padding:30px;
    border-left:5px solid #b00000;
    color:#b00000;
}

@media(max-width:700px){

    .teams{
        font-size:20px;
    }

    .role{
        flex-direction:column;
        gap:7px;
    }

    .role-person{
        text-align:left;
    }

}

</style>
</head>

<body>

<header>

    REF HOCKEY

    <br>

    <a class="back" href="index.html">
        ← ВСЕ МАТЧИ
    </a>

</header>


<div class="container">

    <div id="content">
        Загрузка...
    </div>

</div>


<script>

const SUPABASE_URL =
    "https://ckfwxtirevtzgrzwypio.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_N55S09HuLN-2XlnYCjE61w_AKX12EuB";

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const params =
    new URLSearchParams(window.location.search);

const matchId =
    params.get("id");


function escapeHtml(text){

    return String(text || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function formatDate(date){

    if(!date) return "";

    const months = [
        "января","февраля","марта","апреля",
        "мая","июня","июля","августа",
        "сентября","октября","ноября","декабря"
    ];

    const d =
        new Date(date + "T00:00:00");

    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}


async function loadMatch(){

    const content =
        document.getElementById("content");


    if(!matchId){

        content.innerHTML = `
            <div class="error">
                Матч не найден.
            </div>
        `;

        return;
    }


    const { data: match, error } =
        await supabase
            .from("matches")
            .select("*")
            .eq("id",matchId)
            .single();


    if(error || !match){

        console.error(error);

        content.innerHTML = `
            <div class="error">
                Матч не найден.
            </div>
        `;

        return;
    }


    const refereeIds = [
        match.ref1,
        match.ref2,
        match.line1,
        match.line2,
        match.secretary,
        match.announcer,
        match.penalty1,
        match.penalty2,
        match.goal1,
        match.goal2
    ].filter(Boolean);


    let refereeMap = {};


    if(refereeIds.length){

        const { data: refs } =
            await supabase
                .from("referees")
                .select("id,name")
                .in("id",refereeIds);


        if(refs){

            refs.forEach(ref => {
                refereeMap[ref.id] = ref.name;
            });

        }

    }


    function role(name,id){

        if(!id || !refereeMap[id]){
            return "";
        }

        return `
            <div class="role">

                <div class="role-name">
                    ${name}
                </div>

                <div class="role-person">
                    ${escapeHtml(refereeMap[id])}
                </div>

            </div>
        `;
    }


    content.innerHTML = `

        <div class="match-card">

            <div class="date">
                ${formatDate(match.match_date)}
            </div>

            <div class="teams">
                ${escapeHtml(match.team1)}
                —
                ${escapeHtml(match.team2)}
            </div>

            <div class="info">

                ${match.match_time
                    ? escapeHtml(match.match_time)
                    : ""}

                ${match.place
                    ? " • " + escapeHtml(match.place)
                    : ""}

            </div>

        </div>


        <div class="ref-card">

            <h2>СУДЕЙСКАЯ БРИГАДА</h2>

            ${role("Главный судья",match.ref1)}
            ${role("Главный судья",match.ref2)}

            ${role("Линейный судья",match.line1)}
            ${role("Линейный судья",match.line2)}

            ${role("Секретарь матча",match.secretary)}

            ${role("Информатор",match.announcer)}

            ${role(
                "Судья при оштрафованных",
                match.penalty1
            )}

            ${role(
                "Судья при оштрафованных",
                match.penalty2
            )}

            ${role(
                "Судья за воротами",
                match.goal1
            )}

            ${role(
                "Судья за воротами",
                match.goal2
            )}

        </div>
    `;

}


loadMatch();

</script>

</body>
</html>
