<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Матч — REF HOCKEY</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<header class="top">

  <div class="top-inner">

    <a class="logo" href="index.html">
      REF HOCKEY
    </a>

    <nav class="nav">

      <a href="index.html">
        Матчи
      </a>

      <a href="admin.html">
        Админка
      </a>

    </nav>

  </div>

</header>


<main class="wrap">

  <a class="back" href="index.html">
    ← ВСЕ МАТЧИ
  </a>

  <div id="content"></div>

</main>


<script src="config.js"></script>


<script>

const roles = [

  ["Главный судья","ref1"],

  ["Главный судья","ref2"],

  ["Линейный судья","line1"],

  ["Линейный судья","line2"],

  ["Секретарь матча","secretary"],

  ["Информатор","announcer"],

  ["Судья при оштрафованных","penalty1"],

  ["Судья при оштрафованных","penalty2"],

  ["Судья за воротами","goal1"],

  ["Судья за воротами","goal2"]

];


async function load(){

  const id =
    new URLSearchParams(location.search).get("id");

  const box =
    document.getElementById("content");


  if(!id){

    box.innerHTML =
      '<div class="empty">Матч не найден.</div>';

    return;

  }


  try{

    const matches =
      await api(
        `matches?id=eq.${encodeURIComponent(id)}&select=*`
      );


    if(!matches.length){

      box.innerHTML =
        '<div class="empty">Матч не найден.</div>';

      return;

    }


    const m = matches[0];


    const ids =
      roles
        .map(r => m[r[1]])
        .filter(Boolean);


    let refs = [];


    if(ids.length){

      refs =
        await api(
          `referees?id=in.(${ids.join(",")})&select=id,name`
        );

    }


    const names = {};


    refs.forEach(r => {

      names[r.id] = r.name;

    });


    const rows =

      roles

        .filter(r =>
          m[r[1]] &&
          names[m[r[1]]]
        )

        .map(r => `

          <div class="ref-row">

            <div class="role">
              ${r[0]}
            </div>

            <div class="person">
              ${esc(names[m[r[1]]])}
            </div>

          </div>

        `)

        .join("");


    box.innerHTML = `

      <section class="match-head">

        <div class="date">
          ${formatDate(m.match_date)}
        </div>

        <h1>
          ${esc(m.team1)}
          —
          ${esc(m.team2)}
        </h1>

        <div class="meta">

          ${esc(m.match_time || "")}

          ${
            m.place
              ? "<br>" + esc(m.place)
              : ""
          }

        </div>

      </section>


      <section class="brigade">

        <h2>
          СУДЕЙСКАЯ БРИГАДА
        </h2>

        ${
          rows ||
          '<div class="empty">Состав бригады пока не указан.</div>'
        }

      </section>

    `;


  }catch(e){

    box.innerHTML =
      `<div class="empty">
        Ошибка: ${esc(e.message)}
      </div>`;

  }

}


load();

</script>

  <script src="config.js"></script>

</body>
</html>
