<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Админка — Матчи</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f5f8;
            color: #111;
        }

        header {
            background: #000056;
            color: white;
            padding: 22px 20px;
        }

        header h1 {
            max-width: 1100px;
            margin: auto;
            font-size: 26px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .panel h2 {
            margin-bottom: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #000056;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .save {
            background: #000056;
            color: white;
            margin-top: 20px;
        }

        .cancel {
            background: #ddd;
            color: #111;
            margin-top: 20px;
            margin-left: 8px;
            display: none;
        }

        .match-admin {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .match-info strong {
            font-size: 18px;
            display: block;
            margin-bottom: 7px;
        }

        .match-info span {
            color: #666;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .edit {
            background: #e8e8f5;
            color: #000056;
        }

        .delete {
            background: #ffe4e4;
            color: #b00000;
        }

        .empty {
            color: #777;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .match-admin {
                flex-direction: column;
                align-items: flex-start;
            }

            .actions {
                width: 100%;
            }

            .actions button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>АДМИН-ПАНЕЛЬ</h1>
</header>

<main class="container">

    <section class="panel">

        <h2 id="formTitle">Добавить матч</h2>

        <div class="form-grid">

            <div class="field">
                <label>Команда 1</label>
                <input id="team1" type="text" placeholder="Челны">
            </div>

            <div class="field">
                <label>Команда 2</label>
                <input id="team2" type="text" placeholder="Нефтяник">
            </div>

            <div class="field">
                <label>Дата</label>
                <input id="date" type="date">
            </div>

            <div class="field">
                <label>Время</label>
                <input id="time" type="time">
            </div>

            <div class="field full">
                <label>Место</label>
                <input id="place" type="text" placeholder="ЛД Основной">
            </div>

            <div class="field">
                <label>Главный судья</label>
                <input id="mainReferee1" type="text">
            </div>

            <div class="field">
                <label>Главный судья</label>
                <input id="mainReferee2" type="text">
            </div>

            <div class="field">
                <label>Линейный судья</label>
                <input id="lineReferee1" type="text">
            </div>

            <div class="field">
                <label>Линейный судья</label>
                <input id="lineReferee2" type="text">
            </div>

            <div class="field">
                <label>Секретарь матча</label>
                <input id="secretary" type="text">
            </div>

            <div class="field">
                <label>Информатор</label>
                <input id="announcer" type="text">
            </div>

            <div class="field">
                <label>Судьи при оштрафованных</label>
                <input id="penaltyJudges" type="text">
            </div>

            <div class="field">
                <label>Судьи за воротами</label>
                <input id="goalJudges" type="text">
            </div>

        </div>

        <button class="save" onclick="saveMatch()">
            Сохранить матч
        </button>

        <button id="cancelButton" class="cancel" onclick="cancelEdit()">
            Отмена
        </button>

    </section>


    <section class="panel">

        <h2>Матчи</h2>

        <div id="matchesList"></div>

    </section>

</main>


<script>

    let editingId = null;


    function getMatches() {
        return JSON.parse(localStorage.getItem("matches")) || [];
    }


    function saveMatches(matches) {
        localStorage.setItem("matches", JSON.stringify(matches));
    }


    function value(id) {
        return document.getElementById(id).value.trim();
    }


    function saveMatch() {

        const team1 = value("team1");
        const team2 = value("team2");
        const date = value("date");
        const time = value("time");
        const place = value("place");

        if (!team1 || !team2 || !date || !time || !place) {
            alert("Заполни команды, дату, время и место.");
            return;
        }


        const match = {

            id: editingId || Date.now(),

            team1,
            team2,
            date,
            time,
            place,

            mainReferee1: value("mainReferee1"),
            mainReferee2: value("mainReferee2"),

            lineReferee1: value("lineReferee1"),
            lineReferee2: value("lineReferee2"),

            secretary: value("secretary"),
            announcer: value("announcer"),

            penaltyJudges: value("penaltyJudges"),
            goalJudges: value("goalJudges")
        };


        let matches = getMatches();


        if (editingId) {

            matches = matches.map(item =>
                item.id === editingId ? match : item
            );

        } else {

            matches.push(match);

        }


        saveMatches(matches);

        alert(
            editingId
                ? "Матч изменён."
                : "Матч добавлен."
        );


        clearForm();
        showMatches();
    }


    function editMatch(id) {

        const match = getMatches().find(item => item.id === id);

        if (!match) return;


        editingId = id;


        document.getElementById("formTitle").textContent =
            "Редактировать матч";


        document.getElementById("team1").value =
            match.team1 || "";

        document.getElementById("team2").value =
            match.team2 || "";

        document.getElementById("date").value =
            match.date || "";

        document.getElementById("time").value =
            match.time || "";

        document.getElementById("place").value =
            match.place || "";


        document.getElementById("mainReferee1").value =
            match.mainReferee1 || "";

        document.getElementById("mainReferee2").value =
            match.mainReferee2 || "";

        document.getElementById("lineReferee1").value =
            match.lineReferee1 || "";

        document.getElementById("lineReferee2").value =
            match.lineReferee2 || "";

        document.getElementById("secretary").value =
            match.secretary || "";

        document.getElementById("announcer").value =
            match.announcer || "";

        document.getElementById("penaltyJudges").value =
            match.penaltyJudges || "";

        document.getElementById("goalJudges").value =
            match.goalJudges || "";


        document.getElementById("cancelButton").style.display =
            "inline-block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    function deleteMatch(id) {

        if (!confirm("Удалить этот матч?")) {
            return;
        }


        let matches = getMatches();

        matches = matches.filter(item => item.id !== id);

        saveMatches(matches);

        showMatches();
    }


    function cancelEdit() {

        clearForm();

    }


    function clearForm() {

        editingId = null;

        document.getElementById("formTitle").textContent =
            "Добавить матч";


        document.querySelectorAll("input").forEach(input => {
            input.value = "";
        });


        document.getElementById("cancelButton").style.display =
            "none";
    }


    function formatDate(date) {

        const parts = date.split("-");

        if (parts.length !== 3) {
            return date;
        }

        return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }


    function showMatches() {

        const container =
            document.getElementById("matchesList");

        const matches = getMatches();


        if (matches.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    Матчей пока нет.
                </div>
            `;

            return;
        }


        container.innerHTML = "";


        matches.forEach(match => {

            const item =
                document.createElement("div");

            item.className = "match-admin";


            item.innerHTML = `

                <div class="match-info">

                    <strong>
                        ${escapeHtml(match.team1)}
                        —
                        ${escapeHtml(match.team2)}
                    </strong>

                    <span>
                        ${formatDate(match.date)}
                        ·
                        ${escapeHtml(match.time)}
                        ·
                        ${escapeHtml(match.place)}
                    </span>

                </div>


                <div class="actions">

                    <button
                        class="edit"
                        onclick="editMatch(${match.id})">
                        Изменить
                    </button>

                    <button
                        class="delete"
                        onclick="deleteMatch(${match.id})">
                        Удалить
                    </button>

                </div>
            `;


            container.appendChild(item);

        });

    }


    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text || "";

        return div.innerHTML;

    }


    showMatches();

</script>

</body>
</html>
