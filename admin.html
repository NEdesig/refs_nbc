<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Админ-панель</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Unbounded", sans-serif;
    background: #f5f5f5;
    color: #202024;
}

/* HEADER */

header {
    background: #202024;
    color: white;
    padding: 22px 25px;
}

.header-inner {
    max-width: 1200px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 18px;
    font-weight: 700;
}

.back {
    color: white;
    text-decoration: none;
    font-size: 11px;
    opacity: .65;
}

/* CONTAINER */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 45px 25px 80px;
}

.page-title {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -2px;
    margin-bottom: 30px;
}

/* TABS */

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    overflow-x: auto;
}

.tab {
    border: none;
    background: #e7e7e9;
    color: #555;

    padding: 14px 20px;

    border-radius: 100px;

    font-family: inherit;
    font-size: 12px;
    font-weight: 600;

    cursor: pointer;

    white-space: nowrap;
}

.tab.active {
    background: #ff5b22;
    color: white;
}

/* PANELS */

.panel {
    background: white;
    border-radius: 28px;
    padding: 30px;
}

.panel-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 25px;
}

/* FORM */

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    font-size: 11px;
    color: #777;
    font-weight: 600;
}

input,
select {
    width: 100%;

    border: none;
    background: #f1f1f2;

    border-radius: 13px;

    padding: 15px;

    font-family: inherit;
    font-size: 13px;

    outline: none;
}

input:focus,
select:focus {
    box-shadow: 0 0 0 2px #ff5b22;
}

/* BUTTONS */

button {
    font-family: inherit;
    cursor: pointer;
}

.primary {
    border: none;

    background: #ff5b22;
    color: white;

    border-radius: 100px;

    padding: 15px 22px;

    font-size: 11px;
    font-weight: 700;

    margin-top: 22px;
}

.secondary {
    border: none;

    background: #e9e9ea;
    color: #222;

    border-radius: 100px;

    padding: 15px 22px;

    font-size: 11px;
    font-weight: 600;

    margin-top: 22px;
    margin-left: 7px;
}

/* MATCH LIST */

.match-list {
    margin-top: 25px;

    display: flex;
    flex-direction: column;
    gap: 12px;
}

.match-item {
    background: #f5f5f5;

    border-radius: 18px;

    padding: 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 20px;
}

.match-name {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
}

.match-details {
    color: #777;
    font-size: 10px;
}

.actions {
    display: flex;
    gap: 7px;
}

.edit {
    border: none;
    background: #e4e4e6;

    padding: 11px 15px;

    border-radius: 100px;

    font-size: 10px;
}

.delete {
    border: none;
    background: #ffe4dc;
    color: #d53e0c;

    padding: 11px 15px;

    border-radius: 100px;

    font-size: 10px;
}

/* REFEREES */

.referee-form {
    display: flex;
    gap: 10px;
}

.referee-form input {
    flex: 1;
}

.referee-form button {
    margin: 0;
    flex-shrink: 0;
}

.referee-list {
    margin-top: 25px;

    display: flex;
    flex-direction: column;
    gap: 10px;
}

.referee-item {
    background: #f5f5f5;

    border-radius: 17px;

    padding: 17px 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;
}

.referee-name {
    font-size: 13px;
    font-weight: 600;
}

.empty {
    color: #888;
    font-size: 12px;
    padding: 20px 0;
}

/* MOBILE */

@media (max-width: 700px) {

    .container {
        padding: 35px 16px 60px;
    }

    .page-title {
        font-size: 32px;
    }

    .panel {
        padding: 22px;
        border-radius: 23px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

    .match-item {
        align-items: flex-start;
        flex-direction: column;
    }

    .actions {
        width: 100%;
    }

    .actions button {
        flex: 1;
    }

    .referee-form {
        flex-direction: column;
    }

    .referee-form button {
        width: 100%;
    }
}

</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            REF HOCKEY
        </div>

        <a href="index.html" class="back">
            НА САЙТ →
        </a>

    </div>

</header>


<main class="container">

    <h1 class="page-title">
        АДМИНКА
    </h1>


    <!-- TABS -->

    <div class="tabs">

        <button
            class="tab active"
            onclick="showTab('matches', this)">
            МАТЧИ
        </button>

        <button
            class="tab"
            onclick="showTab('referees', this)">
            РЕЕСТР СУДЕЙ
        </button>

    </div>


    <!-- ===================== -->
    <!-- MATCHES -->
    <!-- ===================== -->

    <section id="matchesTab">

        <div class="panel">

            <div class="panel-title" id="formTitle">
                Добавить матч
            </div>


            <div class="form-grid">

                <div class="field">

                    <label>
                        КОМАНДА 1
                    </label>

                    <input
                        id="team1"
                        type="text"
                        placeholder="Челны">

                </div>


                <div class="field">

                    <label>
                        КОМАНДА 2
                    </label>

                    <input
                        id="team2"
                        type="text"
                        placeholder="Нефтяник">

                </div>


                <div class="field">

                    <label>
                        ДАТА
                    </label>

                    <input
                        id="date"
                        type="date">

                </div>


                <div class="field">

                    <label>
                        ВРЕМЯ
                    </label>

                    <input
                        id="time"
                        type="time">

                </div>


                <div class="field full">

                    <label>
                        МЕСТО
                    </label>

                    <input
                        id="place"
                        type="text"
                        placeholder="ЛД Основной">

                </div>


                <!-- REFEREES -->

                <div class="field">

                    <label>
                        ГЛАВНЫЙ СУДЬЯ
                    </label>

                    <select id="mainReferee1">
                    </select>

                </div>


                <div class="field">

                    <label>
                        ГЛАВНЫЙ СУДЬЯ
                    </label>

                    <select id="mainReferee2">
                    </select>

                </div>


                <div class="field">

                    <label>
                        ЛИНЕЙНЫЙ СУДЬЯ
                    </label>

                    <select id="lineReferee1">
                    </select>

                </div>


                <div class="field">

                    <label>
                        ЛИНЕЙНЫЙ СУДЬЯ
                    </label>

                    <select id="lineReferee2">
                    </select>

                </div>


                <div class="field">

                    <label>
                        СЕКРЕТАРЬ МАТЧА
                    </label>

                    <select id="secretary">
                    </select>

                </div>


                <div class="field">

                    <label>
                        ИНФОРМАТОР
                    </label>

                    <select id="announcer">
                    </select>

                </div>


                <div class="field">

                    <label>
                        СУДЬИ ПРИ ОШТРАФОВАННЫХ
                    </label>

                    <select id="penaltyJudges">
                    </select>

                </div>


                <div class="field">

                    <label>
                        СУДЬИ ЗА ВОРОТАМИ
                    </label>

                    <select id="goalJudges">
                    </select>

                </div>

            </div>


            <button
                class="primary"
                onclick="saveMatch()">

                СОХРАНИТЬ МАТЧ

            </button>


            <button
                id="cancelButton"
                class="secondary"
                onclick="cancelEdit()"
                style="display:none;">

                ОТМЕНА

            </button>

        </div>


        <div class="panel" style="margin-top:20px;">

            <div class="panel-title">
                Матчи
            </div>

            <div id="matchesList"
                 class="match-list">
            </div>

        </div>

    </section>


    <!-- ===================== -->
    <!-- REFEREES -->
    <!-- ===================== -->

    <section
        id="refereesTab"
        style="display:none;">

        <div class="panel">

            <div class="panel-title">
                Реестр судей
            </div>


            <div class="referee-form">

                <input
                    id="refereeName"
                    type="text"
                    placeholder="Фамилия Имя Отчество">

                <button
                    class="primary"
                    onclick="addReferee()">

                    ДОБАВИТЬ

                </button>

            </div>


            <div
                id="refereeList"
                class="referee-list">
            </div>

        </div>

    </section>

</main>


<script>

/* =========================
   STORAGE
========================= */

function getMatches() {

    return JSON.parse(
        localStorage.getItem("matches")
    ) || [];

}


function saveMatches(matches) {

    localStorage.setItem(
        "matches",
        JSON.stringify(matches)
    );

}


function getReferees() {

    return JSON.parse(
        localStorage.getItem("referees")
    ) || [];

}


function saveReferees(referees) {

    localStorage.setItem(
        "referees",
        JSON.stringify(referees)
    );

}


/* =========================
   TABS
========================= */

function showTab(tab, button) {

    const matches =
        document.getElementById("matchesTab");

    const referees =
        document.getElementById("refereesTab");


    const buttons =
        document.querySelectorAll(".tab");


    buttons.forEach(item => {

        item.classList.remove("active");

    });


    button.classList.add("active");


    if (tab === "matches") {

        matches.style.display = "block";
        referees.style.display = "none";

    } else {

        matches.style.display = "none";
        referees.style.display = "block";

        showReferees();

    }

}


/* =========================
   REFEREE REGISTRY
========================= */

function addReferee() {

    const input =
        document.getElementById("refereeName");

    const name =
        input.value.trim();


    if (!name) {

        alert("Введите ФИО судьи.");

        return;

    }


    const referees =
        getReferees();


    referees.push({

        id: Date.now(),

        name: name

    });


    saveReferees(referees);


    input.value = "";


    showReferees();

    updateRefereeSelects();

}


function deleteReferee(id) {

    if (!confirm("Удалить судью из реестра?")) {

        return;

    }


    let referees =
        getReferees();


    referees =
        referees.filter(
            referee => referee.id !== id
        );


    saveReferees(referees);


    showReferees();

    updateRefereeSelects();

}


function showReferees() {

    const container =
        document.getElementById("refereeList");

    const referees =
        getReferees();


    container.innerHTML = "";


    if (referees.length === 0) {

        container.innerHTML = `
            <div class="empty">
                В реестре пока нет судей.
            </div>
        `;

        return;

    }


    referees.forEach(referee => {

        const item =
            document.createElement("div");

        item.className =
            "referee-item";


        item.innerHTML = `

            <div class="referee-name">
                ${escapeHtml(referee.name)}
            </div>

            <button
                class="delete"
                onclick="deleteReferee(${referee.id})">

                УДАЛИТЬ

            </button>

        `;


        container.appendChild(item);

    });

}


/* =========================
   SELECTS
========================= */

function updateRefereeSelects() {

    const referees =
        getReferees();


    const ids = [

        "mainReferee1",
        "mainReferee2",

        "lineReferee1",
        "lineReferee2",

        "secretary",
        "announcer",

        "penaltyJudges",
        "goalJudges"

    ];


    ids.forEach(id => {

        const select =
            document.getElementById(id);


        const oldValue =
            select.value;


        select.innerHTML = `

            <option value="">
                Не назначен
            </option>

        `;


        referees.forEach(referee => {

            const option =
                document.createElement("option");


            option.value =
                referee.name;


            option.textContent =
                referee.name;


            select.appendChild(option);

        });


        if (
            referees.some(
                referee =>
                    referee.name === oldValue
            )
        ) {

            select.value = oldValue;

        }

    });

}


/* =========================
   MATCHES
========================= */

let editingId = null;


function value(id) {

    return document
        .getElementById(id)
        .value;

}


function saveMatch() {

    const team1 =
        value("team1").trim();

    const team2 =
        value("team2").trim();

    const date =
        value("date");

    const time =
        value("time");

    const place =
        value("place").trim();


    if (
        !team1 ||
        !team2 ||
        !date ||
        !time ||
        !place
    ) {

        alert(
            "Заполни команды, дату, время и место."
        );

        return;

    }


    const match = {

        id: editingId || Date.now(),

        team1,
        team2,
        date,
        time,
        place,

        mainReferee1: value("mainReferee1"),
        mainReferee2: value("mainReferee2"),

        lineReferee1: value("lineReferee1"),
        lineReferee2: value("lineReferee2"),

        secretary: value("secretary"),
        announcer: value("announcer"),

        penaltyJudges: value("penaltyJudges"),
        goalJudges: value("goalJudges")

    };


    let matches =
        getMatches();


    if (editingId) {

        matches =
            matches.map(item =>
                item.id === editingId
                    ? match
                    : item
            );

    } else {

        matches.push(match);

    }


    saveMatches(matches);


    clearForm();

    showMatches();


    alert(
        editingId
            ? "Матч изменён."
            : "Матч добавлен."
    );

}


function editMatch(id) {

    const match =
        getMatches().find(
            item => item.id === id
        );


    if (!match) return;


    editingId = id;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Редактировать матч";


    document.getElementById("team1").value =
        match.team1 || "";

    document.getElementById("team2").value =
        match.team2 || "";

    document.getElementById("date").value =
        match.date || "";

    document.getElementById("time").value =
        match.time || "";

    document.getElementById("place").value =
        match.place || "";


    updateRefereeSelects();


    document.getElementById("mainReferee1").value =
        match.mainReferee1 || "";

    document.getElementById("mainReferee2").value =
        match.mainReferee2 || "";

    document.getElementById("lineReferee1").value =
        match.lineReferee1 || "";

    document.getElementById("lineReferee2").value =
        match.lineReferee2 || "";

    document.getElementById("secretary").value =
        match.secretary || "";

    document.getElementById("announcer").value =
        match.announcer || "";

    document.getElementById("penaltyJudges").value =
        match.penaltyJudges || "";

    document.getElementById("goalJudges").value =
        match.goalJudges || "";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function deleteMatch(id) {

    if (!confirm("Удалить этот матч?")) {

        return;

    }


    let matches =
        getMatches();


    matches =
        matches.filter(
            item => item.id !== id
        );


    saveMatches(matches);


    showMatches();

}


function cancelEdit() {

    clearForm();

}


function clearForm() {

    editingId = null;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Добавить матч";


    document
        .querySelectorAll(
            "#matchesTab input"
        )
        .forEach(input => {

            input.value = "";

        });


    document
        .querySelectorAll(
            "#matchesTab select"
        )
        .forEach(select => {

            select.value = "";

        });


    document.getElementById(
        "cancelButton"
    ).style.display =
        "none";

}


/* =========================
   MATCH LIST
========================= */

function formatDate(date) {

    const parts =
        date.split("-");


    if (parts.length !== 3) {

        return date;

    }


    return `${parts[2]}.${parts[1]}.${parts[0]}`;

}


function showMatches() {

    const container =
        document.getElementById(
            "matchesList"
        );


    const matches =
        getMatches();


    container.innerHTML = "";


    if (matches.length === 0) {

        container.innerHTML = `
            <div class="empty">
                Матчей пока нет.
            </div>
        `;

        return;

    }


    matches.forEach(match => {

        const item =
            document.createElement("div");


        item.className =
            "match-item";


        item.innerHTML = `

            <div>

                <div class="match-name">

                    ${escapeHtml(match.team1)}
                    —
                    ${escapeHtml(match.team2)}

                </div>

                <div class="match-details">

                    ${formatDate(match.date)}
                    ·
                    ${escapeHtml(match.time)}
                    ·
                    ${escapeHtml(match.place)}

                </div>

            </div>


            <div class="actions">

                <button
                    class="edit"
                    onclick="editMatch(${match.id})">

                    ИЗМЕНИТЬ

                </button>


                <button
                    class="delete"
                    onclick="deleteMatch(${match.id})">

                    УДАЛИТЬ

                </button>

            </div>

        `;


        container.appendChild(item);

    });

}


/* =========================
   SECURITY
========================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}


/* =========================
   START
========================= */

updateRefereeSelects();

showMatches();

</script>

</body>
</html>
