<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Админ-панель — REF HOCKEY</title>

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Unbounded',sans-serif;
    background:#eeeeee;
    color:#111;
}

header{
    background:#111;
    color:white;
    padding:22px 30px;
    font-size:22px;
    font-weight:700;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

.tab{
    border:0;
    background:#d5d5d5;
    padding:15px 22px;
    font-family:inherit;
    font-weight:600;
    cursor:pointer;
}

.tab.active{
    background:#ff6a00;
    color:white;
}

.panel{
    display:none;
}

.panel.active{
    display:block;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:25px;
    border-left:5px solid #ff6a00;
}

h2{
    margin-top:0;
    font-size:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}

label{
    font-size:12px;
    font-weight:600;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    background:#fff;
    font-family:inherit;
    font-size:12px;
}

button{
    font-family:inherit;
}

.save{
    margin-top:20px;
    padding:15px 25px;
    border:0;
    background:#ff6a00;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.save:hover{
    background:#111;
}

.match-item,
.referee-item{
    background:#f5f5f5;
    padding:18px;
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.actions{
    display:flex;
    gap:8px;
}

.edit,
.delete{
    border:0;
    padding:10px 14px;
    color:white;
    cursor:pointer;
    font-family:inherit;
    font-size:11px;
}

.edit{
    background:#555;
}

.delete{
    background:#111;
}

.referee-add{
    display:flex;
    gap:10px;
}

.referee-add input{
    flex:1;
}

@media(max-width:700px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .tabs{
        flex-direction:column;
    }

    .match-item,
    .referee-item{
        flex-direction:column;
        align-items:flex-start;
    }

    .referee-add{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header>REF HOCKEY — АДМИН-ПАНЕЛЬ</header>

<div class="container">

    <div class="tabs">
        <button class="tab active" onclick="showTab('matches',this)">
            МАТЧИ
        </button>

        <button class="tab" onclick="showTab('referees',this)">
            РЕЕСТР СУДЕЙ
        </button>
    </div>


    <!-- МАТЧИ -->

    <section id="matches" class="panel active">

        <div class="card">

            <h2 id="formTitle">ДОБАВИТЬ МАТЧ</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>КОМАНДА 1</label>
                    <input id="team1" placeholder="Челны">
                </div>

                <div class="form-group">
                    <label>КОМАНДА 2</label>
                    <input id="team2" placeholder="Нефтяник">
                </div>

                <div class="form-group">
                    <label>ДАТА</label>
                    <input id="date" type="date">
                </div>

                <div class="form-group">
                    <label>ВРЕМЯ</label>
                    <input id="time" type="time">
                </div>

                <div class="form-group">
                    <label>МЕСТО</label>
                    <input id="place" placeholder="ЛД Основной">
                </div>

                <div class="form-group">
                    <label>ГЛАВНЫЙ СУДЬЯ 1</label>
                    <select id="ref1"></select>
                </div>

                <div class="form-group">
                    <label>ГЛАВНЫЙ СУДЬЯ 2</label>
                    <select id="ref2"></select>
                </div>

                <div class="form-group">
                    <label>ЛИНЕЙНЫЙ СУДЬЯ 1</label>
                    <select id="line1"></select>
                </div>

                <div class="form-group">
                    <label>ЛИНЕЙНЫЙ СУДЬЯ 2</label>
                    <select id="line2"></select>
                </div>

                <div class="form-group">
                    <label>СЕКРЕТАРЬ МАТЧА</label>
                    <select id="secretary"></select>
                </div>

                <div class="form-group">
                    <label>ИНФОРМАТОР</label>
                    <select id="announcer"></select>
                </div>

                <div class="form-group">
                    <label>СУДЬЯ ПРИ ОШТРАФОВАННЫХ 1</label>
                    <select id="penalty1"></select>
                </div>

                <div class="form-group">
                    <label>СУДЬЯ ПРИ ОШТРАФОВАННЫХ 2</label>
                    <select id="penalty2"></select>
                </div>

                <div class="form-group">
                    <label>СУДЬЯ ЗА ВОРОТАМИ 1</label>
                    <select id="goal1"></select>
                </div>

                <div class="form-group">
                    <label>СУДЬЯ ЗА ВОРОТАМИ 2</label>
                    <select id="goal2"></select>
                </div>

            </div>

            <button class="save" onclick="saveMatch()">
                СОХРАНИТЬ МАТЧ
            </button>

        </div>


        <div class="card">

            <h2>МАТЧИ</h2>

            <div id="matchesList"></div>

        </div>

    </section>


    <!-- РЕЕСТР СУДЕЙ -->

    <section id="referees" class="panel">

        <div class="card">

            <h2>ДОБАВИТЬ СУДЬЮ</h2>

            <div class="referee-add">

                <input
                    id="refereeName"
                    placeholder="ФИО судьи"
                >

                <button class="save" onclick="addReferee()">
                    ДОБАВИТЬ
                </button>

            </div>

        </div>

        <div class="card">

            <h2>РЕЕСТР СУДЕЙ</h2>

            <div id="refereesList"></div>

        </div>

    </section>

</div>


<script>

let matches = JSON.parse(
    localStorage.getItem("matches") || "[]"
);

let referees = JSON.parse(
    localStorage.getItem("referees") || "[]"
);

let editingId = null;


/* TABS */

function showTab(tab, button){

    document.querySelectorAll(".panel").forEach(
        el => el.classList.remove("active")
    );

    document.querySelectorAll(".tab").forEach(
        el => el.classList.remove("active")
    );

    document.getElementById(tab).classList.add("active");

    button.classList.add("active");

}


/* ESCAPE */

function escapeHtml(text){

    if(!text) return "";

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* REFEREE SELECTS */

function fillSelects(){

    const ids = [
        "ref1",
        "ref2",
        "line1",
        "line2",
        "secretary",
        "announcer",
        "penalty1",
        "penalty2",
        "goal1",
        "goal2"
    ];

    ids.forEach(id => {

        const select = document.getElementById(id);

        select.innerHTML =
            `<option value="">Не назначен</option>`;

        referees.forEach((name,index) => {

            select.innerHTML += `
                <option value="${index}">
                    ${escapeHtml(name)}
                </option>
            `;

        });

    });

}


/* ADD REFEREE */

function addReferee(){

    const input =
        document.getElementById("refereeName");

    const name = input.value.trim();

    if(!name) return;

    referees.push(name);

    localStorage.setItem(
        "referees",
        JSON.stringify(referees)
    );

    input.value = "";

    fillSelects();
    renderReferees();

}


/* DELETE REFEREE */

function deleteReferee(index){

    if(!confirm("Удалить этого судью?")) return;

    referees.splice(index,1);

    localStorage.setItem(
        "referees",
        JSON.stringify(referees)
    );

    fillSelects();
    renderReferees();

}


/* RENDER REFEREES */

function renderReferees(){

    const box =
        document.getElementById("refereesList");

    if(!referees.length){

        box.innerHTML =
            "<p>Реестр судей пуст.</p>";

        return;
    }

    box.innerHTML = referees.map(
        (name,index) => `

        <div class="referee-item">

            <strong>
                ${escapeHtml(name)}
            </strong>

            <div class="actions">

                <button
                    class="delete"
                    onclick="deleteReferee(${index})"
                >
                    УДАЛИТЬ
                </button>

            </div>

        </div>

    `).join("");

}


/* SAVE MATCH */

function saveMatch(){

    const match = {

        id: editingId || Date.now(),

        team1:
            document.getElementById("team1").value.trim(),

        team2:
            document.getElementById("team2").value.trim(),

        date:
            document.getElementById("date").value,

        time:
            document.getElementById("time").value,

        place:
            document.getElementById("place").value.trim(),

        ref1:
            document.getElementById("ref1").value,

        ref2:
            document.getElementById("ref2").value,

        line1:
            document.getElementById("line1").value,

        line2:
            document.getElementById("line2").value,

        secretary:
            document.getElementById("secretary").value,

        announcer:
            document.getElementById("announcer").value,

        penalty1:
            document.getElementById("penalty1").value,

        penalty2:
            document.getElementById("penalty2").value,

        goal1:
            document.getElementById("goal1").value,

        goal2:
            document.getElementById("goal2").value
    };


    if(!match.team1 || !match.team2){

        alert("Укажите обе команды.");

        return;
    }


    if(editingId){

        const index =
            matches.findIndex(m => m.id === editingId);

        if(index !== -1){

            matches[index] = match;

        }

    }else{

        matches.push(match);

    }


    localStorage.setItem(
        "matches",
        JSON.stringify(matches)
    );


    resetForm();
    renderMatches();

    alert("Матч сохранён.");

}


/* RESET */

function resetForm(){

    editingId = null;

    document.getElementById("formTitle")
        .textContent = "ДОБАВИТЬ МАТЧ";

    [
        "team1",
        "team2",
        "date",
        "time",
        "place"
    ].forEach(id => {

        document.getElementById(id).value = "";

    });


    [
        "ref1",
        "ref2",
        "line1",
        "line2",
        "secretary",
        "announcer",
        "penalty1",
        "penalty2",
        "goal1",
        "goal2"
    ].forEach(id => {

        document.getElementById(id).value = "";

    });

}


/* EDIT MATCH */

function editMatch(id){

    const match =
        matches.find(m => m.id === id);

    if(!match) return;

    editingId = id;

    document.getElementById("formTitle")
        .textContent = "РЕДАКТИРОВАТЬ МАТЧ";


    document.getElementById("team1").value =
        match.team1 || "";

    document.getElementById("team2").value =
        match.team2 || "";

    document.getElementById("date").value =
        match.date || "";

    document.getElementById("time").value =
        match.time || "";

    document.getElementById("place").value =
        match.place || "";


    document.getElementById("ref1").value =
        match.ref1 || "";

    document.getElementById("ref2").value =
        match.ref2 || "";

    document.getElementById("line1").value =
        match.line1 || "";

    document.getElementById("line2").value =
        match.line2 || "";

    document.getElementById("secretary").value =
        match.secretary || "";

    document.getElementById("announcer").value =
        match.announcer || "";

    document.getElementById("penalty1").value =
        match.penalty1 || "";

    document.getElementById("penalty2").value =
        match.penalty2 || "";

    document.getElementById("goal1").value =
        match.goal1 || "";

    document.getElementById("goal2").value =
        match.goal2 || "";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* DELETE MATCH */

function deleteMatch(id){

    if(!confirm("Удалить матч?")) return;

    matches =
        matches.filter(m => m.id !== id);

    localStorage.setItem(
        "matches",
        JSON.stringify(matches)
    );

    renderMatches();

}


/* FORMAT DATE */

function formatDate(date){

    if(!date) return "";

    const months = [
        "января",
        "февраля",
        "марта",
        "апреля",
        "мая",
        "июня",
        "июля",
        "августа",
        "сентября",
        "октября",
        "ноября",
        "декабря"
    ];

    const d =
        new Date(date + "T00:00:00");

    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;

}


/* RENDER MATCHES */

function renderMatches(){

    const box =
        document.getElementById("matchesList");

    if(!matches.length){

        box.innerHTML =
            "<p>Матчей пока нет.</p>";

        return;
    }


    box.innerHTML = matches.map(match => `

        <div class="match-item">

            <div>

                <strong>
                    ${escapeHtml(match.team1)}
                    -
                    ${escapeHtml(match.team2)}
                </strong>

                <br><br>

                ${formatDate(match.date)}
                ${match.time ? " • " + escapeHtml(match.time) : ""}
                ${match.place ? " • " + escapeHtml(match.place) : ""}

            </div>

            <div class="actions">

                <button
                    class="edit"
                    onclick="editMatch(${match.id})"
                >
                    ИЗМЕНИТЬ
                </button>

                <button
                    class="delete"
                    onclick="deleteMatch(${match.id})"
                >
                    УДАЛИТЬ
                </button>

            </div>

        </div>

    `).join("");

}


/* START */

fillSelects();
renderReferees();
renderMatches();

</script>

</body>
</html>
