<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Админка — REF HOCKEY</title>

<link rel="stylesheet" href="style.css?v=4">

</head>

<body>

<header class="top">

  <div class="top-inner">

    <a class="logo" href="index.html">
      REF HOCKEY
    </a>

  </div>

</header>


<main class="wrap">


<!-- ================= LOGIN ================= -->

<section
  id="loginScreen"
  class="auth-box"
>

  <div class="panel auth-panel">

    <h1>
      ВХОД В АДМИНКУ
    </h1>

    <form id="loginForm">

      <label>
        EMAIL
      </label>

      <input
        id="loginEmail"
        type="email"
        required
        placeholder="admin@email.com"
      >


      <label>
        ПАРОЛЬ
      </label>

      <input
        id="loginPassword"
        type="password"
        required
        placeholder="••••••••"
      >


      <button
        class="btn"
        type="submit"
      >
        ВОЙТИ
      </button>

    </form>


    <div
      id="loginStatus"
      class="status"
    ></div>

  </div>

</section>


<!-- ================= ADMIN ================= -->

<section
  id="adminScreen"
  class="hidden"
>

  <div class="admin-head">

    <h1 class="section-title">
      АДМИНКА
    </h1>

    <button
      id="logoutButton"
      class="btn dark"
    >
      ВЫЙТИ
    </button>

  </div>


  <div class="admin-grid">


    <!-- ===== REFEREES ===== -->

    <section class="panel">

      <h2>
        РЕЕСТР СУДЕЙ
      </h2>


      <form id="refForm">

        <label>
          ФИО СУДЬИ
        </label>

        <input
          id="refName"
          required
          placeholder="Иванов Иван Иванович"
        >


        <br><br>


        <button
          class="btn"
          type="submit"
        >
          ДОБАВИТЬ СУДЬЮ
        </button>

      </form>


      <div
        id="refStatus"
        class="status"
      ></div>


      <div
        id="refList"
        class="list"
      ></div>

    </section>


    <!-- ===== MATCH ===== -->

    <section class="panel">

      <h2 id="matchFormTitle">
        ДОБАВИТЬ МАТЧ
      </h2>


      <form id="matchForm">

        <div class="form-grid">


          <div>

            <label>
              КОМАНДА 1
            </label>

            <input
              id="team1"
              required
              placeholder="Челны"
            >

          </div>


          <div>

            <label>
              КОМАНДА 2
            </label>

            <input
              id="team2"
              required
              placeholder="Нефтяник"
            >

          </div>


          <div>

            <label>
              ДАТА
            </label>

            <input
              id="date"
              type="date"
              required
            >

            <div
              id="weekday"
              class="date-weekday"
            ></div>

          </div>


          <div>

            <label>
              ВРЕМЯ
            </label>

            <input
              id="time"
              type="time"
            >

          </div>


          <div class="full">

            <label>
              МЕСТО
            </label>

            <input
              id="place"
              placeholder="Лд Основной"
            >

          </div>


          <div
            id="refFields"
            class="full"
          ></div>


          <div class="full form-buttons">

            <button
              id="saveMatchButton"
              class="btn"
              type="submit"
            >
              ДОБАВИТЬ МАТЧ
            </button>


            <button
              id="cancelEditButton"
              class="btn dark hidden"
              type="button"
            >
              ОТМЕНА
            </button>

          </div>

        </div>

      </form>


      <div
        id="matchStatus"
        class="status"
      ></div>

    </section>

  </div>


  <!-- ===== MATCH LIST ===== -->

  <section
    class="panel"
    style="margin-top:20px"
  >

    <h2>
      МАТЧИ
    </h2>


    <div
      id="matchList"
      class="list"
    ></div>

  </section>

</section>

</main>


<script src="config.js"></script>

<script>

const roleFields = [

  ["Главный судья","ref1"],

  ["Главный судья","ref2"],

  ["Линейный судья","line1"],

  ["Линейный судья","line2"],

  ["Секретарь матча","secretary"],

  ["Информатор","announcer"],

  ["Судья при оштрафованных","penalty1"],

  ["Судья при оштрафованных","penalty2"],

  ["Судья за воротами","goal1"],

  ["Судья за воротами","goal2"]

];


let referees = [];

let editingMatchId = null;


/* ================= AUTH ================= */


function showAdmin(){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("adminScreen")
    .classList.remove("hidden");

}


function showLogin(){

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

  document
    .getElementById("adminScreen")
    .classList.add("hidden");

}


document
  .getElementById("loginForm")
  .addEventListener("submit",async event=>{

    event.preventDefault();


    const status =
      document.getElementById("loginStatus");


    status.className =
      "status";

    status.textContent =
      "Вход...";


    try{

      await login(

        document
          .getElementById("loginEmail")
          .value
          .trim(),

        document
          .getElementById("loginPassword")
          .value

      );


      showAdmin();


      await loadRefs();
      await loadMatches();


    }catch(error){

      status.className =
        "status error";

      status.textContent =
        error.message;

    }

  });


document
  .getElementById("logoutButton")
  .addEventListener("click",async()=>{

    await logout();

    showLogin();

  });


/* ================= REFEREES ================= */


function renderRefFields(){

  document
    .getElementById("refFields")
    .innerHTML =

      roleFields.map(
        ([label,key])=>`

          <div style="margin-bottom:10px">

            <label>
              ${esc(label)}
            </label>

            <select id="${key}">

              <option value="">
                — не назначен —
              </option>

              ${
                referees.map(referee=>`

                  <option value="${referee.id}">
                    ${esc(referee.name)}
                  </option>

                `).join("")
              }

            </select>

          </div>

        `
      ).join("");

}


async function loadRefs(){

  referees =
    await api(
      "referees?select=id,name&order=name.asc"
    );


  document
    .getElementById("refList")
    .innerHTML =

      referees.length

        ? referees.map(referee=>`

            <div class="list-item">

              <span>
                ${esc(referee.name)}
              </span>

              <button
                class="small-btn"
                onclick="deleteRef(${referee.id})"
              >
                Удалить
              </button>

            </div>

          `).join("")

        : `
          <div class="empty">
            Реестр пуст.
          </div>
        `;


  renderRefFields();

}


async function deleteRef(id){

  if(
    !confirm(
      "Удалить судью из реестра?"
    )
  ) return;


  try{

    await api(
      `referees?id=eq.${id}`,
      {
        method:"DELETE"
      }
    );


    await loadRefs();


  }catch(error){

    alert(
      "Ошибка: " +
      error.message
    );

  }

}


document
  .getElementById("refForm")
  .addEventListener("submit",async event=>{

    event.preventDefault();


    const status =
      document.getElementById("refStatus");


    try{

      await api(
        "referees",
        {
          method:"POST",

          headers:{
            "Prefer":"return=minimal"
          },

          body:JSON.stringify({

            name:
              document
                .getElementById("refName")
                .value
                .trim()

          })

        }
      );


      document
        .getElementById("refName")
        .value = "";


      status.className =
        "status ok";

      status.textContent =
        "Судья добавлен.";


      await loadRefs();


    }catch(error){

      status.className =
        "status error";

      status.textContent =
        "Ошибка: " +
        error.message;

    }

  });


/* ================= WEEKDAY ================= */


document
  .getElementById("date")
  .addEventListener("change",()=>{

    const date =
      document
        .getElementById("date")
        .value;


    document
      .getElementById("weekday")
      .textContent =
        date
          ? getWeekday(date)
          : "";

  });


/* ================= MATCH FORM ================= */


function resetMatchForm(){

  editingMatchId = null;


  document
    .getElementById("matchForm")
    .reset();


  document
    .getElementById("matchFormTitle")
    .textContent =
      "ДОБАВИТЬ МАТЧ";


  document
    .getElementById("saveMatchButton")
    .textContent =
      "ДОБАВИТЬ МАТЧ";


  document
    .getElementById("cancelEditButton")
    .classList.add("hidden");


  document
    .getElementById("weekday")
    .textContent = "";


  renderRefFields();

}


function editMatch(match){

  editingMatchId =
    match.id;


  document
    .getElementById("matchFormTitle")
    .textContent =
      "РЕДАКТИРОВАТЬ МАТЧ";


  document
    .getElementById("saveMatchButton")
    .textContent =
      "СОХРАНИТЬ ИЗМЕНЕНИЯ";


  document
    .getElementById("cancelEditButton")
    .classList.remove("hidden");


  document
    .getElementById("team1")
    .value =
      match.team1 || "";


  document
    .getElementById("team2")
    .value =
      match.team2 || "";


  document
    .getElementById("date")
    .value =
      match.match_date || "";


  document
    .getElementById("time")
    .value =
      match.match_time || "";


  document
    .getElementById("place")
    .value =
      match.place || "";


  document
    .getElementById("weekday")
    .textContent =
      match.match_date
        ? getWeekday(match.match_date)
        : "";


  roleFields.forEach(([,key])=>{

    const select =
      document.getElementById(key);


    if(select){

      select.value =
        match[key]
          ? String(match[key])
          : "";

    }

  });


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


document
  .getElementById("cancelEditButton")
  .addEventListener(
    "click",
    resetMatchForm
  );


document
  .getElementById("matchForm")
  .addEventListener("submit",async event=>{

    event.preventDefault();


    const status =
      document
        .getElementById("matchStatus");


    const data = {

      team1:
        document
          .getElementById("team1")
          .value
          .trim(),

      team2:
        document
          .getElementById("team2")
          .value
          .trim(),

      match_date:
        document
          .getElementById("date")
          .value ||
        null,

      match_time:
        document
          .getElementById("time")
          .value ||
        null,

      place:
        document
          .getElementById("place")
          .value
          .trim() ||
        null

    };


    roleFields.forEach(([,key])=>{

      const value =
        document
          .getElementById(key)
          ?.value;


      data[key] =
        value
          ? Number(value)
          : null;

    });


    try{

      if(editingMatchId){

        await api(
          `matches?id=eq.${editingMatchId}`,
          {
            method:"PATCH",

            headers:{
              "Prefer":"return=minimal"
            },

            body:JSON.stringify(data)

          }
        );


        status.className =
          "status ok";

        status.textContent =
          "Матч изменён.";

      }else{

        await api(
          "matches",
          {
            method:"POST",

            headers:{
              "Prefer":"return=minimal"
            },

            body:JSON.stringify(data)

          }
        );


        status.className =
          "status ok";

        status.textContent =
          "Матч добавлен.";

      }


      resetMatchForm();

      await loadMatches();


    }catch(error){

      status.className =
        "status error";

      status.textContent =
        "Ошибка: " +
        error.message;

    }

  });


/* ================= MATCH LIST ================= */


async function loadMatches(){

  const box =
    document.getElementById("matchList");


  try{

    const matches =
      await api(
        "matches?select=*&order=match_date.asc,match_time.asc"
      );


    box.innerHTML =

      matches.length

        ? matches.map(match=>`

            <div class="list-item">

              <span>

                <b>
                  ${esc(match.team1)}
                  —
                  ${esc(match.team2)}
                </b>

                <br>

                ${esc(
                  formatDateWithWeekday(
                    match.match_date
                  )
                )}

                ·

                ${esc(match.match_time || "")}

                ·

                ${esc(match.place || "")}

                <br>

                <small>

                  ${
                    isArchived(match)
                      ? "АРХИВ"
                      : "ПРЕДСТОЯЩИЙ"
                  }

                </small>

              </span>


              <div
                style="display:flex;gap:7px;flex-wrap:wrap"
              >

                <a
                  class="small-btn"
                  href="match.html?id=${match.id}"
                >
                  Открыть
                </a>


                <button
                  class="small-btn"
                  onclick='editMatch(${JSON.stringify(match).replace(/'/g,"&#39;")})'
                >
                  Изменить
                </button>


                <button
                  class="small-btn"
                  onclick="deleteMatch(${match.id})"
                >
                  Удалить
                </button>

              </div>

            </div>

          `).join("")

        : `
          <div class="empty">
            Матчей пока нет.
          </div>
        `;


  }catch(error){

    box.innerHTML =
      `<div class="status error">
        Ошибка: ${esc(error.message)}
      </div>`;

  }

}


async function deleteMatch(id){

  if(
    !confirm(
      "Удалить матч?"
    )
  ) return;


  try{

    await api(
      `matches?id=eq.${id}`,
      {
        method:"DELETE"
      }
    );


    await loadMatches();


  }catch(error){

    alert(
      "Ошибка: " +
      error.message
    );

  }

}


/* ================= START ================= */


if(getSession()){

  showAdmin();

  loadRefs()
    .then(loadMatches)
    .catch(error=>{

      showLogin();

      console.error(error);

    });

}else{

  showLogin();

}

</script>

</body>

</html>
