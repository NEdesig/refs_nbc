<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Админка — REF HOCKEY</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<header class="top">

  <div class="top-inner">

    <a class="logo" href="index.html">
      REF HOCKEY
    </a>

    <nav class="nav">

      <a href="index.html">
        Матчи
      </a>

      <a class="active" href="admin.html">
        Админка
      </a>

    </nav>

  </div>

</header>


<main class="wrap">

  <h1
    class="section-title"
    style="margin-top:10px"
  >
    АДМИНКА
  </h1>


  <div class="admin-grid">


    <!-- РЕЕСТР -->

    <section class="panel">

      <h2>
        РЕЕСТР СУДЕЙ
      </h2>


      <form id="refForm">

        <label>
          ФИО судьи
        </label>

        <input
          id="refName"
          required
          placeholder="Иванов Иван Иванович"
        >

        <br><br>

        <button
          class="btn"
          type="submit"
        >
          ДОБАВИТЬ СУДЬЮ
        </button>

      </form>


      <div
        id="refStatus"
        class="status"
      ></div>


      <div
        id="refList"
        class="list"
      ></div>

    </section>



    <!-- ДОБАВЛЕНИЕ МАТЧА -->

    <section class="panel">

      <h2>
        ДОБАВИТЬ МАТЧ
      </h2>


      <form id="matchForm">

        <div class="form-grid">


          <div>

            <label>
              КОМАНДА 1
            </label>

            <input
              id="team1"
              required
              placeholder="Челны"
            >

          </div>


          <div>

            <label>
              КОМАНДА 2
            </label>

            <input
              id="team2"
              required
              placeholder="Нефтяник"
            >

          </div>


          <div>

            <label>
              ДАТА
            </label>

            <input
              id="date"
              type="date"
              required
            >

          </div>


          <div>

            <label>
              ВРЕМЯ
            </label>

            <input
              id="time"
              type="time"
            >

          </div>


          <div class="full">

            <label>
              МЕСТО
            </label>

            <input
              id="place"
              placeholder="Лд Основной"
            >

          </div>


          <div
            id="refFields"
            class="full"
          ></div>


          <div class="full">

            <button
              class="btn"
              type="submit"
            >
              ДОБАВИТЬ МАТЧ
            </button>

          </div>


        </div>

      </form>


      <div
        id="matchStatus"
        class="status"
      ></div>

    </section>

  </div>



  <!-- СПИСОК МАТЧЕЙ -->

  <section
    class="panel"
    style="margin-top:20px"
  >

    <h2>
      ДОБАВЛЕННЫЕ МАТЧИ
    </h2>


    <div
      id="matchList"
      class="list"
    ></div>

  </section>

</main>


<script src="config.js"></script>


<script>

const roleFields = [

  ["Главный судья","ref1"],

  ["Главный судья","ref2"],

  ["Линейный судья","line1"],

  ["Линейный судья","line2"],

  ["Секретарь матча","secretary"],

  ["Информатор","announcer"],

  ["Судья при оштрафованных","penalty1"],

  ["Судья при оштрафованных","penalty2"],

  ["Судья за воротами","goal1"],

  ["Судья за воротами","goal2"]

];


let referees = [];



function renderRefFields(){

  document.getElementById("refFields").innerHTML =

    roleFields.map(([label,key]) => `

      <div style="margin-bottom:10px">

        <label>
          ${label}
        </label>

        <select id="${key}">

          <option value="">
            — не назначен —
          </option>

          ${
            referees.map(r => `

              <option value="${r.id}">
                ${esc(r.name)}
              </option>

            `).join("")
          }

        </select>

      </div>

    `).join("");

}



async function loadRefs(){

  try{

    referees =
      await api(
        "referees?select=id,name&order=name.asc"
      );


    document.getElementById("refList").innerHTML =

      referees.length

        ? referees.map(r => `

          <div class="list-item">

            <span>
              ${esc(r.name)}
            </span>

            <button
              class="small-btn"
              onclick="deleteRef(${r.id})"
            >
              Удалить
            </button>

          </div>

        `).join("")

        :

        '<div class="empty">Реестр пуст.</div>';


    renderRefFields();


  }catch(e){

    document.getElementById("refStatus").className =
      "status error";

    document.getElementById("refStatus").textContent =
      "Ошибка: " + e.message;

  }

}



async function deleteRef(id){

  if(
    !confirm(
      "Удалить судью из реестра?"
    )
  ) return;


  try{

    await api(
      `referees?id=eq.${id}`,
      {
        method:"DELETE"
      }
    );


    await loadRefs();


  }catch(e){

    alert(
      "Ошибка: " + e.message
    );

  }

}



document
  .getElementById("refForm")
  .addEventListener(
    "submit",
    async e => {

      e.preventDefault();


      const status =
        document.getElementById("refStatus");


      try{

        await api(
          "referees",
          {
            method:"POST",

            headers:{
              "Prefer":"return=minimal"
            },

            body:JSON.stringify({

              name:
                document
                  .getElementById("refName")
                  .value
                  .trim()

            })

          }
        );


        document
          .getElementById("refName")
          .value = "";


        status.className =
          "status ok";

        status.textContent =
          "Судья добавлен.";


        await loadRefs();


      }catch(err){

        status.className =
          "status error";

        status.textContent =
          "Ошибка: " + err.message;

      }

    }
  );



document
  .getElementById("matchForm")
  .addEventListener(
    "submit",
    async e => {

      e.preventDefault();


      const status =
        document.getElementById("matchStatus");


      const data = {

        team1:
          document
            .getElementById("team1")
            .value
            .trim(),

        team2:
          document
            .getElementById("team2")
            .value
            .trim(),

        match_date:
          document
            .getElementById("date")
            .value ||
          null,

        match_time:
          document
            .getElementById("time")
            .value ||
          null,

        place:
          document
            .getElementById("place")
            .value
            .trim() ||
          null

      };


      roleFields.forEach(
        ([,key]) => {

          const v =
            document
              .getElementById(key)
              ?.value;

          data[key] =
            v
              ? Number(v)
              : null;

        }
      );


      try{

        await api(
          "matches",
          {
            method:"POST",

            headers:{
              "Prefer":"return=minimal"
            },

            body:
              JSON.stringify(data)

          }
        );


        status.className =
          "status ok";

        status.textContent =
          "Матч добавлен.";


        e.target.reset();


        await loadMatches();


      }catch(err){

        status.className =
          "status error";

        status.textContent =
          "Ошибка: " + err.message;

      }

    }
  );



async function loadMatches(){

  const box =
    document.getElementById("matchList");


  try{

    const matches =
      await api(
        "matches?select=*&order=match_date.asc,match_time.asc"
      );


    box.innerHTML =

      matches.length

        ? matches.map(m => `

          <div class="list-item">

            <span>

              <b>
                ${esc(m.team1)}
                —
                ${esc(m.team2)}
              </b>

              <br>

              ${formatDate(m.match_date)}
              ·
              ${esc(m.match_time || "")}
              ·
              ${esc(m.place || "")}

            </span>


            <div
              style="display:flex;gap:7px"
            >

              <a
                class="small-btn"
                href="match.html?id=${m.id}"
              >
                Открыть
              </a>


              <button
                class="small-btn"
                onclick="deleteMatch(${m.id})"
              >
                Удалить
              </button>

            </div>

          </div>

        `).join("")

        :

        '<div class="empty">Матчей пока нет.</div>';


  }catch(e){

    box.innerHTML =
      `<div class="status error">
        Ошибка: ${esc(e.message)}
      </div>`;

  }

}



async function deleteMatch(id){

  if(
    !confirm("Удалить матч?")
  ) return;


  try{

    await api(
      `matches?id=eq.${id}`,
      {
        method:"DELETE"
      }
    );


    await loadMatches();


  }catch(e){

    alert(
      "Ошибка: " + e.message
    );

  }

}



(async()=>{

  await loadRefs();

  await loadMatches();

})();

</script>

<script src="config.js"></script>
  
</body>
</html>
